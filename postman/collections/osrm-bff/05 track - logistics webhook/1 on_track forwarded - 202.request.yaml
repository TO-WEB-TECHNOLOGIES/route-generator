$kind: http-request
method: POST
url: '{{baseUrl}}/internal/v1/logistics/on_track'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Token
    value: '{{internalToken}}'
body:
  type: json
  content: |-
    {
      "event": "order_tracking",
      "orderId": "{{trackOrderId}}",
      "status": "active",
      "gps": "28.497671,77.088763",
      "locationTimestamp": "2026-11-10T05:30:32.866Z",
      "path": [
        { "lat_lng": "28.495340,77.088059", "sequence": "1" },
        { "lat_lng": "28.495470,77.087364", "sequence": "2" },
        { "lat_lng": "28.496203,77.087864", "sequence": "3" },
        { "lat_lng": "28.496921,77.088545", "sequence": "4" },
        { "lat_lng": "28.497671,77.088763", "sequence": "5" }
      ],
      "updatedAt": "2026-11-10T05:30:34.472Z",
      "fulfillmentState": "Order-picked-up",
      "startGps": "28.495340,77.088059",
      "endGps": "28.459469,77.026635"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('trackOrderId', 'pm-track-' + Date.now());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('202 { accepted: true } at once (routing runs after answering)', () => {
        pm.response.to.have.status(202);
        pm.expect(pm.response.json()).to.eql({ accepted: true });
        pm.expect(pm.response.responseTime).to.be.below(300);
      });

$kind: http-request
method: POST
url: '{{baseUrl}}/internal/v1/track/enrich'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Token
    value: '{{internalToken}}'
body:
  type: json
  content: |-
    {
      "order_id": "{{flowOrderId}}",
      "stage": "Out-for-delivery",
      "gps": "28.497771,77.088763",
      "store_gps": "28.495340,77.088059",
      "drop_gps": "28.459469,77.026635",
      "path": [
        { "lat_lng": "28.495340,77.088059", "sequence": 1, "timestamp": "2026-11-06T10:00:00.000Z" },
        { "lat_lng": "28.495470,77.087364", "sequence": 2, "timestamp": "2026-11-06T10:00:15.000Z" },
        { "lat_lng": "28.496203,77.087864", "sequence": 3, "timestamp": "2026-11-06T10:00:30.000Z" },
        { "lat_lng": "28.496921,77.088545", "sequence": 4, "timestamp": "2026-11-06T10:00:45.000Z" },
        { "lat_lng": "28.497671,77.088763", "sequence": 5, "timestamp": "2026-11-06T10:01:00.000Z" }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // REROUTE_THRESHOLD_M = 30: an 11 m move (e.g. waiting at a light) keeps the line stable.
      const body = pm.response.json();
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('route_ahead is the cached one (moved < 30 m)', () => {
        pm.expect(body.route_ahead.polyline).to.eql(pm.collectionVariables.get('routePolyline1'));
      });

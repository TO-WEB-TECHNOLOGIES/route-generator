# Local dev stack: OSRM + Redis + this service.
# Build map data first: bash ops/osrm/build.sh  (writes ops/data/<date>/ and ops/data/current)
# Ports are bound to 127.0.0.1 only. OSRM must never be publicly reachable.
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld --max-matching-size 100 /data/current/region-latest.osrm
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  osrm-bff:
    build: ..
    environment:
      PORT: "4100"
      OSRM_BASE_URL: http://osrm:5000
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "osrm-bff:dev:"
    ports:
      - "127.0.0.1:4100:4100"
    depends_on: [osrm, redis]
    restart: unless-stopped

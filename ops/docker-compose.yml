# Local dev stack.
#   docker compose -f ops/docker-compose.yml up -d            -> OSRM + Redis (run the service with `npm run dev`)
#   docker compose -f ops/docker-compose.yml --profile app up -d --build   -> also runs osrm-bff in Docker
#
# First start: osrm-prep downloads + clips the NCR map (~279 MB download), then osrm builds the
# routing graph. Several minutes. Later starts reuse the osrm-data volume and take seconds.
# Ports are bound to 127.0.0.1 only. OSRM must never be publicly reachable.
name: osrm-bff

services:
  # Step 1: download the Delhi/Haryana/UP/Karnataka extracts (or use ops/maps/), clip each to the NCR
  # and Bengaluru boxes, merge. Runs once, then exits.
  osrm-prep:
    build:
      context: ./osrm
      dockerfile: prep.Dockerfile
    image: osrm-bff/osrm-prep:1
    pull_policy: build
    # Defaults are baked into ops/osrm/prep.Dockerfile; override here if needed:
    # environment:
    #   OSRM_BBOX: "76.75,28.20,77.80,28.95;77.35,12.75,77.90,13.25"   # NCR;Bengaluru
    #   OSRM_FORCE_REBUILD: "1"
    volumes:
      - osrm-data:/data
      # Map files you downloaded yourself (see ops/maps/README.md). If any .pbf is here, it's
      # used instead of downloading. Read-only: prep never modifies your files.
      - ./maps:/maps:ro
    restart: "no"

  # Step 2: build the routing graph (first start only) and serve it on :5000.
  osrm:
    build: ./osrm
    image: osrm-bff/osrm-ncr:5.27.1
    pull_policy: build
    volumes:
      - osrm-data:/data
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      osrm-prep:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  osrm-bff:
    profiles: ["app"]
    build: ..
    environment:
      PORT: "4100"
      OSRM_BASE_URL: http://osrm:5000
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "osrm-bff:dev:"
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      osrm:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  osrm-data:

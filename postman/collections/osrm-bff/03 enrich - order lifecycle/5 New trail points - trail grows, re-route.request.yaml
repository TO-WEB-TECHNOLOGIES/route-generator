$kind: http-request
method: POST
url: '{{baseUrl}}/internal/v1/track/enrich'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Token
    value: '{{internalToken}}'
body:
  type: json
  content: |-
    {
      "order_id": "{{flowOrderId}}",
      "stage": "Out-for-delivery",
      "gps": "28.495652,77.086702",
      "store_gps": "28.495340,77.088059",
      "drop_gps": "28.459469,77.026635",
      "path": [
        { "lat_lng": "28.495340,77.088059", "sequence": 1, "timestamp": "2026-11-06T10:00:00.000Z" },
        { "lat_lng": "28.495470,77.087364", "sequence": 2, "timestamp": "2026-11-06T10:00:15.000Z" },
        { "lat_lng": "28.496203,77.087864", "sequence": 3, "timestamp": "2026-11-06T10:00:30.000Z" },
        { "lat_lng": "28.496921,77.088545", "sequence": 4, "timestamp": "2026-11-06T10:00:45.000Z" },
        { "lat_lng": "28.497671,77.088763", "sequence": 5, "timestamp": "2026-11-06T10:01:00.000Z" },
        { "lat_lng": "28.497087,77.088067", "sequence": 6, "timestamp": "2026-11-06T10:01:15.000Z" },
        { "lat_lng": "28.496359,77.087398", "sequence": 7, "timestamp": "2026-11-06T10:01:30.000Z" },
        { "lat_lng": "28.495652,77.086702", "sequence": 8, "timestamp": "2026-11-06T10:01:45.000Z" }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Points 6-8 are new: only they (plus 1 overlap point, no. 5) are matched and appended.
      const body = pm.response.json();
      const before = pm.collectionVariables.get('roadPath1');
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('road_path grew and keeps the earlier trail as its prefix', () => {
        pm.expect(body.road_path.length).to.be.above(before.length);
        pm.expect(body.road_path.startsWith(before)).to.be.true;
      });
      pm.test('rider moved > 30 m, so the route ahead was rebuilt', () => {
        pm.expect(body.route_ahead.to).to.eql('drop');
        pm.expect(body.route_ahead.polyline).to.not.eql(pm.collectionVariables.get('routePolyline1'));
      });
      pm.collectionVariables.set('roadPath2', body.road_path || '');

# Local dev stack.
#   docker compose -f ops/docker-compose.yml up -d            -> OSRM + Redis (run the service with `npm run dev`)
#   docker compose -f ops/docker-compose.yml --profile app up -d --build   -> also runs osrm-bff in Docker
#
# First OSRM start downloads the NCR extracts and builds the dataset (several minutes); follow it
# with `docker compose -f ops/docker-compose.yml logs -f osrm`. Later starts reuse the osrm-data volume.
# Ports are bound to 127.0.0.1 only. OSRM must never be publicly reachable.
name: osrm-bff

services:
  osrm:
    build: ./osrm
    image: osrm-bff/osrm-ncr:5.27.1
    # Defaults are baked into ops/osrm/Dockerfile; override here if needed:
    # environment:
    #   OSRM_BBOX: "76.75,28.20,77.80,28.95"
    #   OSRM_FORCE_REBUILD: "1"
    volumes:
      - osrm-data:/data
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  osrm-bff:
    profiles: ["app"]
    build: ..
    environment:
      PORT: "4100"
      OSRM_BASE_URL: http://osrm:5000
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "osrm-bff:dev:"
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      osrm:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  osrm-data:

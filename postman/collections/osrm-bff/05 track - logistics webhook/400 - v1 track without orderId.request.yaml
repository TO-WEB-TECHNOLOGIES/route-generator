$kind: http-request
method: POST
url: '{{baseUrl}}/v1/track'
order: 6000
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Token
    value: '{{internalToken}}'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 INVALID_ORDER_ID, logistics not called', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('INVALID_ORDER_ID');
      });

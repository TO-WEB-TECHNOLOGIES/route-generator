$kind: http-request
description: |-
  Workbench shape: one breadcrumb, always sequence "1", equal to gps. Since 2026-11-12 osrm-bff
  ignores path[] for the trail and records each gps itself, so the trail still grows.
method: POST
url: '{{baseUrl}}/internal/v1/logistics/on_track'
order: 4100
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Token
    value: '{{internalToken}}'
body:
  type: json
  content: |-
    {
      "event": "order_tracking",
      "orderId": "{{workbenchOrderId}}",
      "status": "active",
      "gps": "28.495340,77.088059",
      "locationTimestamp": "2026-11-12T06:00:00.000Z",
      "path": [{ "lat_lng": "28.495340,77.088059", "sequence": "1" }],
      "updatedAt": "2026-11-12T06:00:01.000Z",
      "config": { "attr": "tracking.location.gps", "type": "live_poll" },
      "fulfillmentState": "Order-picked-up",
      "startGps": "28.495340,77.088059",
      "endGps": "28.459469,77.026635"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('workbenchOrderId', 'pm-wb-' + Date.now());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('202 { accepted: true }', () => {
        pm.response.to.have.status(202);
        pm.expect(pm.response.json()).to.eql({ accepted: true });
      });

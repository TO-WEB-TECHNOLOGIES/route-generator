$kind: http-request
method: POST
url: '{{baseUrl}}/internal/v1/track/enrich'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Token
    value: '{{internalToken}}'
body:
  type: json
  content: |-
    {
      "order_id": "pm-edge-badgps",
      "stage": "Out-for-delivery",
      "gps": "somewhere in Gurugram"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 naming the gps field', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.include('gps');
      });

$kind: http-request
method: GET
url: '{{baseUrl}}/v1/orders/{{trackOrderId}}/track'
order: 4000
headers:
  - key: X-Internal-Token
    value: '{{internalToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      setTimeout(() => {}, 1500);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 NO_UPDATE_YET: the final stage dropped the snapshot', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error.code).to.eql('NO_UPDATE_YET');
      });
